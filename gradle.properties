# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the Gradle Daemon.
# Setting a larger heap size is necessary for memory-intensive tasks like Hilt/Kapt.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# AndroidX libraries use the 'androidx' package instead of the 'android.support' package.
android.useAndroidX=true

# Kotlin code style for this project: 'official' or 'obsolete'
kotlin.code.style=official

# Suppress experimental warning: The option setting 'android.disallowKotlinSourceSets=false' is experimental.
# However, AGP 9.0.0+ requires this to be false if using certain plugins that haven't migrated 
# to the new android.sourceSets DSL yet (like current KSP/Hilt integrations in some environments).
android.disallowKotlinSourceSets=false
